name: Commit Checks

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: commit-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Setup and generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create standard debug keystore
        run: |
          DEBUG_KEYSTORE="${ANDROID_USER_HOME:-$HOME/.config/.android}/debug.keystore"
          mkdir -p "$(dirname "$DEBUG_KEYSTORE")"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: ./gradlew --console=plain :app:testFossDebugUnitTest :spotify:test :betterlyrics:test --warning-mode summary

      - name: Build and lint FOSS debug APK
        run: ./gradlew --console=plain assembleFossDebug :app:lintFossDebug --warning-mode summary

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: commit-check-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            spotify/build/reports/tests/
            spotify/build/test-results/
            betterlyrics/build/reports/tests/
            betterlyrics/build/test-results/
          if-no-files-found: ignore
